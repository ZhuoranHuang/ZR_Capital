# 公开策略调研的来源表（第二条 / docs/strategy-survey，2026-10-23 采集）。
# 由 `uv run python -m zr.research.strategy_survey` 读取，生成 STRATEGY_SURVEY.md 的计数与来源表。
# 手工整理，每条的规则都来自所列链接；read 字段说明读到的是什么：
#   pine = 读了 TradingView 公开 Pine 源码（pubscripts-suggest-json / pine-facade 接口取得）
#   python / sql = 读了仓库源码；desc = 只读了作者 / 厂商的文字描述；secondary = 二手摘要（搜索引擎、第三方转述），未读原文
# 热度：TradingView = 脚本点赞数（agreeCount，接口 2026-10-23 读数）；GitHub = 仓库 star（API 2026-10-23 读数）；
#       MQL5 / 聚宽 / 掘金 / 论文 = 平台不公开或无可比热度，写「未取得」。
# category：breakout 趋势突破 / pullback 顺势回调 / mean_reversion 均值回归 / confluence 多指标共振 / vol_filter 波动率过滤
# family：同一入场机制的子类，用于找「最常见」的突破与回调规则
# trend_def：判断趋势的方式（可多选）：
#   price_vs_ma 价在均线一侧 / ma_alignment 均线排列 / ma_slope 均线斜率 / adx ADX 或 DI / swing_structure 高低点结构 /
#   channel 通道（Donchian、Keltner、BOLL、VWAP 带）/ atr_trail ATR 跟踪线状态 / htf 高一级周期确认 /
#   opening_range 开盘区间方向 / momentum 动量或 MACD 符号 / none 不判断趋势
# situation：对应负责人三类情形 ignition 点火 / channel_pullback 通道回调 / range_avoid 回避震荡；none = 都不对应
# symmetric：yes = 原策略多空对称；mirror = 原策略只做一边，下列 mirror 字段给出镜像

