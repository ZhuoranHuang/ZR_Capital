# E1 回踩深度遍历（D-022，R-029）。全部为待测参数（CLAUDE.md 规则 11），不在代码里写死。
# 深度两种定义互为替代（不交叉）：pctb = 回踩极值的 %b 阈值；eps = 回踩极值距中轨的相对距离阈值。
pctb: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8]      # 多头：回踩低点 %b ≤ x；空头：1 − 反弹高点 %b ≤ x
eps: [0.0002, 0.0005, 0.001, 0.002, 0.003, 0.005]  # |极值 − 中轨| / 中轨 ≤ ε
pattern_n: [2, 3]        # 信号 bar 前至少 n 根回调（多头阴线 / 空头阳线），信号 bar 收阳（空头收阴）
bb_period: [10, 20, 30]  # 布林中轨周期（回踩判定用；通道 A/F 的定义不变，见 config/channel.yaml）
bb_k: 2.0
channels: [A, F]
feature_window: 3        # 连续特征：最近 3 根（含当根）的回踩极值
