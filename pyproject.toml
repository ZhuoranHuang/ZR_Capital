[project]
name = "zr"
version = "0.1.0"
description = "ZR Capital 分钟级期权交易系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "longport>=4.3",
    "polars",
    "duckdb",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "structlog",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zr"]

[tool.ruff]
line-length = 100
target-version = "py312"
# legacy/ 为旧日频代码存档，不纳入新规范检查
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
